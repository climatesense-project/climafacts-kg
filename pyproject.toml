[tool.poetry]
name = "climafactskg"
version = "2.1.1"
description = "ClimaFactsKG is a knowledge graph designed to combat pervasive climate misinformation by linking common climate myths with scientific corrections. ClimaFactsKG is integrated with CimpleKG."
authors = ["Grégoire Burel <423662+evhart@users.noreply.github.com>"]
readme = "README.md"
include = [
    { path = "README.md", format = "sdist" },
    { path = "pyproject.toml", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
]
homepage = "https://github.com/climatesense-project/climafacts-kg"
repository = "https://github.com/climatesense-project/climafacts-kg"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
]
keywords = ["nlp", "misinformation", "knowledge graph", "climate change"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
usingversion = "^0.1.2"
pandas = "^2.2.3"
beautifulsoup4 = "^4.13.4"
langcodes = "^3.5.0"
python-dotenv = "^1.1.0"
rdflib = "^7.1.4"
rdflib-endpoint = "^0.5.3"
uvicorn = ">=0.34.2"
sparqlwrapper = "^2.0.0"
langdetect = "^1.0.9"
iso639 = "^0.1.4"
typer = "^0.16.0"
preserve = "^1.2.1"
pyarrow = "^24.0.0"
# LLM classifier is the pipeline's default classifier (see cards_classifier_name
# default in collectors/utils.py) — kept core, not an extra.
pydantic-ai = "^1.78.0"
openai = "^2.30.0"

# --- optional: classifiers/matcher.py (rule-based, spaCy) ---
spacy = { version = "^3.8.7", optional = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl", optional = true }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl", optional = true }

# --- optional: classifiers/transformer.py (HuggingFace, pulls torch) ---
sentence-transformers = { version = "^5.0.0", optional = true }

# --- optional: classifiers/cards/{eval,optimization,datasets}.py (research/eval pipeline) ---
pydantic-evals = { version = "^1.106.0", optional = true }
gepa = { version = ">=0.1.1", optional = true }
gspread = { version = "^6.0.0", optional = true }
google-api-python-client = { version = "^2.0.0", optional = true }

[tool.poetry.extras]
matcher = ["spacy", "en-core-web-sm", "en-core-web-md"]
transformer = ["sentence-transformers"]
eval = ["pydantic-evals", "gepa", "gspread", "google-api-python-client"]
all = [
    "spacy",
    "en-core-web-sm",
    "en-core-web-md",
    "sentence-transformers",
    "pydantic-evals",
    "gepa",
    "gspread",
    "google-api-python-client",
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.2"
pre-commit = "^4.2.0"
python-semantic-release = "^9.12.0"
jupyter = "^1.1.1"
pytest = "^8.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
branch = "main"
upload_to_PyPI = false
upload_to_release = true
build_command = "pip install poetry && poetry build"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.poetry.scripts]
climafactskg = "climafactskg.cli:app"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "N",  # PEP8 naming convetions
    "D",  # pydocstyle
]
ignore = [
    "C901", # too complex
    "W191", # indentation contains tabs
    "D401", # imperative mood
    "D107", # TODO remove docstring warning.
    "D104", # TODO remove docstring warning.
    "D103", # TODO remove docstring warning.
    "D102", # TODO remove docstring warning.
    "D101", # TODO remove docstring warning.
    "D100", # TODO remove docstring warning.
    "D105", # TODO remove docstring warning.
    "W291",
]
exclude = ["data/raw/*", "LICENSE", "README.md"]
