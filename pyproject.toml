[project]
name = "climafactskg"
version = "2.4.0"
description = "ClimaFactsKG is a knowledge graph designed to combat pervasive climate misinformation by linking common climate myths with scientific corrections. ClimaFactsKG is integrated with CimpleKG."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Grégoire Burel", email = "423662+evhart@users.noreply.github.com" }]
keywords = ["nlp", "misinformation", "knowledge graph", "climate change"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
]
dependencies = [
    "usingversion>=0.1.2,<0.2.0",
    "pandas>=2.2.3,<3.0.0",
    "beautifulsoup4>=4.13.4,<5.0.0",
    "langcodes>=3.5.0,<4.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "rdflib>=7.1.4,<8.0.0",
    "rdflib-endpoint>=0.5.3,<0.6.0",
    "uvicorn>=0.34.2",
    "sparqlwrapper>=2.0.0,<3.0.0",
    "langdetect>=1.0.9,<2.0.0",
    "iso639>=0.1.4,<0.2.0",
    "typer>=0.16.0,<0.17.0",
    "preserve>=1.2.1,<2.0.0",
    "pyarrow>=24.0.0,<25.0.0",
    # LLM classifier is the pipeline's default classifier (see cards_classifier_name
    # default in collectors/utils.py) — kept core, not an extra.
    "pydantic-ai>=1.78.0,<2.0.0",
    "openai>=2.30.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/climatesense-project/climafacts-kg"
Repository = "https://github.com/climatesense-project/climafacts-kg"

[project.scripts]
climafactskg = "climafactskg.cli:app"

[project.optional-dependencies]
# classifiers/matcher.py (rule-based, spaCy)
matcher = [
    "spacy>=3.8.7,<4.0.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]
# classifiers/transformer.py (HuggingFace, pulls torch)
transformer = ["sentence-transformers>=5.0.0,<6.0.0"]
# classifiers/cards/{eval,optimization,datasets}.py (research/eval pipeline)
eval = [
    "pydantic-evals>=1.106.0,<2.0.0",
    "gepa>=0.1.1",
    "gspread>=6.0.0,<7.0.0",
    "google-api-python-client>=2.0.0,<3.0.0",
]
all = ["climafactskg[matcher,transformer,eval]"]

[dependency-groups]
dev = [
    "ruff>=0.11.2,<0.12.0",
    "pre-commit>=4.2.0,<5.0.0",
    "python-semantic-release>=10.7.0,<11.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_PyPI = false
upload_to_release = true
build_command = "uv lock && git add uv.lock && uv build"
commit_parser = "conventional"
tag_format = "v{version}"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

# UPDATE splices new releases in at the insertion flag and leaves existing (backfilled) history
# alone. v9 defaulted to INIT (full regeneration from git history), v10 defaults to UPDATE;
# be explicit so a version change can never silently rewrite CHANGELOG.md.
[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "climafactskg"
module-root = ""
source-include = ["README.md", "pyproject.toml", "LICENSE"]
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "N",  # PEP8 naming convetions
    "D",  # pydocstyle
]
ignore = [
    "C901", # too complex
    "W191", # indentation contains tabs
    "D401", # imperative mood
    "D107", # TODO remove docstring warning.
    "D104", # TODO remove docstring warning.
    "D103", # TODO remove docstring warning.
    "D102", # TODO remove docstring warning.
    "D101", # TODO remove docstring warning.
    "D100", # TODO remove docstring warning.
    "D105", # TODO remove docstring warning.
    "W291",
]
exclude = ["data/raw/*", "LICENSE", "README.md"]
