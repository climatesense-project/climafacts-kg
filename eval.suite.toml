model = "qwen/qwen3.8-flash"
[classifiers.options]
max_tokens = 8000
output_mode = "prompted"  # tool_choice=required is rejected in thinking mode

# Mistral: the new generation (Small 4, Ministral 3, Large 3).
[[classifiers]]
