[classifiers.options]
max_tokens = 1500

# Other open-weight models.
[[classifiers]]
label = "glm-5.3-flash"
model = "z-ai/glm-5.3-flash"
size_b = 320
active_b = 18  # 320B total, 18B active, MIT licence, per the Hugging Face model card (zai-org/GLM-5.3-Flash)
[classifiers.options]
max_tokens = 8000

[[classifiers]]
label = "ling-3.0-flash"
model = "inclusionai/ling-3.0-flash"
size_b = 124                             # a 124B mixture of experts, per its model card
[classifiers.options]
max_tokens = 8000

[[classifiers]]
label = "gemma-3-12b"
model = "google/gemma-3-12b-it"
[classifiers.options]
max_tokens = 1500

[[classifiers]]
label = "llama-4-scout"                  # the Llama family leaves the category empty in tool mode, so prompted
model = "meta-llama/llama-4-scout"
size_b = 109
active_b = 17
[classifiers.options]
output_mode = "prompted"
max_tokens = 1500

[[classifiers]]
label = "nemotron-3-nano-30b"
model = "nvidia/nemotron-3-nano-30b-a3b"
[classifiers.options]
max_tokens = 8000

[[classifiers]]
label = "mimo-v2.6-flash"
