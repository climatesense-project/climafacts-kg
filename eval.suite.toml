# ---- closed, expensive: about $7 to $21 for the three benchmarks, so left out unless wanted ------------------------
# [[classifiers]]
# label = "gpt-5.2"
# model = "openai/gpt-5.2"

# ---- the benchmarks: one dataset per family, each with its 0_0 documents ----------------------------------------------
[[datasets]]
name = "climatesense_v1"
label = "climatesense_v1"
climate_only = false

[[datasets]]
name = "climatesense_v2"
label = "climatesense_v2"
climate_only = false
with_context = true                      # review context for the "with" mode

[[datasets]]
name = "nslp"
label = "nslp"
split = "test"
