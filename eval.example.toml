# Example config for `climafactskg eval run eval.example.toml`.
# Preview first: `climafactskg eval run eval.example.toml --dry-run`.

[run]
save_dir = "data/eval_runs"          # each run gets its own timestamped directory
context_modes = ["none", "with"]     # claim only, and claim + review context (paired comparison in the report)
min_context_coverage = 0.5           # warn when "with" runs on a dataset where fewer cases have context
category_scores = "all"              # "all": category scores cover every case, as always.
                                     # "narrative_only": only cases that carry a category (leaves out 0_0 gold)

# Applied to every LLM classifier below; a classifier's own settings win, and `options` merge key by key.
[defaults]
provider = "openrouter"
preset = "xplainnlp-nslp"
cache_path = "data/eval_cache.db"
concurrency = 8
[defaults.options]
temperature = 0.0
top_p = "none"                       # TOML has no null: "none" switches a preset's value off
max_tokens = "none"

[[classifiers]]
label = "gpt-4o-mini | xplainnlp"
model = "openai/gpt-4o-mini"

# Lower concurrency helps models whose OpenRouter backends rate-limit quickly (the errors can cascade into
# fallback-provider failures); the default is 8.
[[classifiers]]
label = "llama-3.1-8b | xplainnlp"
model = "meta-llama/llama-3.1-8b-instruct"
concurrency = 2

# Other prompts: preset = "climatesense-nslp" (the CARDS reasoning prompt) or "cards-narrative" (infers the narrative a
# claim promotes). Presets keep their own sampling settings unless overridden under options.

[[classifiers]]
label = "local | xplainnlp"          # local providers (ollama, lmstudio) are not counted as paid
provider = "ollama"
model = "llama3.1:8b"

[[classifiers]]
label = "transformer"                # free, needs the `transformer` extra
engine = "transformer"

[[classifiers]]
label = "matcher"                    # free, needs the `matcher` extra
engine = "matcher"

[[datasets]]
name = "nslp"
limit = 200                          # quick smoke-test size; drop for the full split

# Datasets with review context are opt-in. `with_context` loads it; cases without any keep their claim only.
[[datasets]]
name = "climatesense_v2"
with_context = true

# The same dataset again, restricted to cases that have context (a fair like-for-like context comparison).
[[datasets]]
name = "climatesense_v2"
label = "climatesense_v2 (context only)"
with_context = true
only_with_context = true

# Include the documents annotated 0_0 (no denial narrative). They also feed the Narrative detection table (precision,
# recall, F1, false alarms). With category_scores = "all" they count in the category scores too; set "narrative_only"
# to keep those on the cases with a category. Costs about 2.6x (v1) / 1.9x (v2) more classifications.
[[datasets]]
name = "climatesense_v2"
label = "climatesense_v2 (incl. not climate)"
climate_only = false
