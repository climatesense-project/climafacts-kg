name: Create Software Release

'on':
  push:
    branches:
      - main
    paths:
      - 'climafactskg/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
  workflow_dispatch:

# Never run two releases at once (each one pushes a commit and a tag).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commit, tag, GitHub release and assets
    env:
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Python Environment (v3.13)
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Only the dev group (pinned python-semantic-release from uv.lock); skips
      # the project and its heavy ML dependencies, which a release does not need.
      - name: Install release tooling
        run: uv sync --locked --only-group dev

      # Bumps pyproject.toml, runs build_command (relocks uv.lock, builds dist/),
      # updates CHANGELOG.md, commits, tags, pushes and creates the GitHub release.
      # Exits 0 without side effects when there are no releasable commits.
      # Guaranteed no PyPI upload (upload_to_PyPI = false in pyproject.toml).
      - name: Semantic Release
        run: uv run --no-sync semantic-release version

      - name: Detect release
        id: release
        shell: bash
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            {
              echo "released=true"
              echo "tag=$TAG"
              echo "version=${TAG#v}"
            } >> "$GITHUB_OUTPUT"
            echo "Released $TAG."
            echo "--- CHANGELOG.md diff from this release (empty means it didn't update — investigate) ---"
            git diff --stat HEAD~1 -- CHANGELOG.md || true
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release this run."
          fi

      - if: steps.release.outputs.released == 'true'
        name: Set release title and upload wheel/sdist
        shell: bash
        run: |
          gh release edit "${{ steps.release.outputs.tag }}" --title "Software ${{ steps.release.outputs.tag }}"
          gh release upload "${{ steps.release.outputs.tag }}" dist/* --clobber
    outputs:
      released: '${{ steps.release.outputs.released }}'
      tag: '${{ steps.release.outputs.tag }}'
      version: '${{ steps.release.outputs.version }}'
