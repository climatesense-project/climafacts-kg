name: Create Release
'on':
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Configure Python Environment (v3.13)
        uses: actions/setup-python@v5.6.0
        with:
          python-version: 3.13
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Check Release Status
        id: release-status
        shell: bash
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          pip install python-semantic-release
          if semantic-release --noop --strict version
          then
          echo "Releasing new version."
          else
          echo "Skipping release steps."
          fi
      - if: steps.release-status.outputs.released == 'true'
        name: Release to GitHub
        id: github-release
        shell: bash
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          # Fetch tags before running the release, in case semantic-release
          # needs full tag history for version/changelog computation.
          git fetch --tags
          # -vv: the v2.1.1 release (the first after the fetch-tags reorder
          # above) still didn't touch CHANGELOG.md, so that wasn't the actual
          # cause. Running with debug verbosity until a real run's log shows
          # why write_changelog_files isn't producing a diff, instead of
          # guessing at another unproven fix.
          semantic-release -vv version
          echo "--- CHANGELOG.md diff from this release (empty means it didn't update — investigate) ---"
          git diff --stat HEAD~1 -- CHANGELOG.md || true
          for file in ./dist/**
          do gh release upload "${{ steps.release-status.outputs.tag }}" $file
          done
      - if: steps.release-status.outputs.released == 'true'
        name: Convert TTL to RDF
        run: |
          cd ${{github.workspace}}
          pip install rdflib
          python -c "from rdflib import Graph; g = Graph(); g.parse('data/climafacts_kg.ttl', format='turtle'); g.serialize(destination='data/climafacts_kg.rdf', format='xml')"
          python -c "from rdflib import Graph; g = Graph(); g.parse('data/cards.ttl', format='turtle'); g.serialize(destination='data/cards.rdf', format='xml')"
        shell: bash
      - if: steps.release-status.outputs.released == 'true'
        name: Add TTL and RDF to Release
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          cd ${{github.workspace}}
          gh release upload "${{steps.release-status.outputs.tag}}" data/climafacts_kg.ttl#climafacts_kg.ttl
          gh release upload "${{steps.release-status.outputs.tag}}" data/climafacts_kg.rdf#climafacts_kg.rdf
          gh release upload "${{steps.release-status.outputs.tag}}" data/cards.ttl#cards.ttl
          gh release upload "${{steps.release-status.outputs.tag}}" data/cards.rdf#cards.rdf
        shell: bash

      - if: steps.release-status.outputs.released == 'true'
        name: Add graph stats to release notes
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          cd ${{github.workspace}}
          python -c "
          from rdflib import RDF, Graph, Namespace

          SDO = Namespace('https://schema.org/')
          CITO = Namespace('http://purl.org/spar/cito/')

          g = Graph()
          g.parse('data/climafacts_kg.ttl')

          stats = {
              'Total RDF triples': len(g),
              'sc:ClaimReview nodes': sum(1 for _ in g.triples((None, RDF.type, SDO.ClaimReview))),
              'sc:ScholarlyArticle nodes': sum(1 for _ in g.triples((None, RDF.type, SDO.ScholarlyArticle))),
              'sc:citation triples': sum(1 for _ in g.triples((None, SDO.citation, None))),
              'cito:cites triples': sum(1 for _ in g.triples((None, CITO.cites, None))),
          }

          with open('stats.md', 'w') as f:
              f.write('## Knowledge Graph Statistics\n\n')
              f.write('| Metric | Count |\n')
              f.write('| :--- | ---: |\n')
              for key, value in stats.items():
                  f.write(f'| {key} | {value:,} |\n')
          "
          gh release view "${{ steps.release-status.outputs.tag }}" --json body -q '.body // ""' > notes.md
          echo "" >> notes.md
          cat stats.md >> notes.md
          gh release edit "${{ steps.release-status.outputs.tag }}" --notes-file notes.md
        shell: bash

      - if: steps.release-status.outputs.released == 'true'
        name: Run GH-Pages Workflow
        env:
            GH_TOKEN: ${{ github.token }}
        run: |
            gh workflow run gh-pages-publish.yml
        shell: bash
    outputs:
      released: '${{ steps.release-status.outputs.released  }}'
      tag: '${{ steps.release-status.outputs.tag}}'
      version: '${{ steps.release-status.outputs.version }}'
