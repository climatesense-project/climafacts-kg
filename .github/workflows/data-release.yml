name: Publish Knowledge Graph Data Release

'on':
  push:
    branches:
      - main
    paths:
      - 'data/**'
  workflow_dispatch:

concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  data-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tag and GitHub release
      actions: write  # trigger gh-pages-publish workflow
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Python Environment (v3.13)
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --only-group dev

      - name: Convert TTL to RDF/XML and validate
        run: |
          uv run --no-project --with rdflib python -c "
          from rdflib import Graph
          import xml.etree.ElementTree as ET

          for stem in ('climafacts_kg', 'cards'):
              ttl_path = f'data/{stem}.ttl'
              rdf_path = f'data/{stem}.rdf'
              g = Graph()
              g.parse(ttl_path, format='turtle')
              g.serialize(destination=rdf_path, format='xml')
              ET.parse(rdf_path)
              print(f'Successfully validated {rdf_path}')
          "

      - name: Determine next CalVer tag
        id: tag
        shell: bash
        run: |
          BASE_TAG="data-$(date +'%Y.%m.%d')"
          TAG="$BASE_TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            COUNT=1
            while git rev-parse "${BASE_TAG}-${COUNT}" >/dev/null 2>&1; do
              COUNT=$((COUNT + 1))
            done
            TAG="${BASE_TAG}-${COUNT}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Generate release notes and graph statistics
        id: notes
        run: |
          uv run --no-project --with rdflib python -c "
          from rdflib import RDF, Graph, Namespace

          SDO = Namespace('https://schema.org/')
          CITO = Namespace('http://purl.org/spar/cito/')

          g = Graph()
          g.parse('data/climafacts_kg.ttl')

          stats = {
              'Total RDF triples': len(g),
              'sc:ClaimReview nodes': sum(1 for _ in g.triples((None, RDF.type, SDO.ClaimReview))),
              'sc:Claim nodes (unique myths)': sum(1 for _ in g.triples((None, RDF.type, SDO.Claim))),
              'sc:ScholarlyArticle nodes': sum(1 for _ in g.triples((None, RDF.type, SDO.ScholarlyArticle))),
              'sc:citation triples (source links)': sum(1 for _ in g.triples((None, SDO.citation, None))),
              'cito:cites triples (scholarly links)': sum(1 for _ in g.triples((None, CITO.cites, None))),
          }

          tag = '${{ steps.tag.outputs.tag }}'
          with open('release_notes.md', 'w') as f:
              f.write(f'# ClimaFactsKG Knowledge Graph Snapshot: {tag}\n\n')
              f.write('This data release contains the latest snapshot of the ClimaFactsKG knowledge graph and the CARDS taxonomy in both Turtle (.ttl) and RDF/XML (.rdf) serialisations.\n\n')
              f.write('## Graph Statistics\n\n')
              f.write('| Metric | Count |\n')
              f.write('| :--- | ---: |\n')
              for key, value in stats.items():
                  f.write(f'| {key} | {value:,} |\n')
          "

      - name: Create GitHub Release
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            --title "Knowledge Graph ${TAG#data-}" \
            --notes-file release_notes.md \
            --latest=false \
            data/climafacts_kg.ttl#climafacts_kg.ttl \
            data/climafacts_kg.rdf#climafacts_kg.rdf \
            data/cards.ttl#cards.ttl \
            data/cards.rdf#cards.rdf

      - name: Trigger GH-Pages Deployment
        shell: bash
        run: |
          gh workflow run gh-pages-publish.yml -f tag="${{ steps.tag.outputs.tag }}"
