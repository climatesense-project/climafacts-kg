name: Deploy Released ClimaFactsKG RDF to GH-Pages
'on':
  repository_dispatch:
    types: [release-event]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to download assets from (e.g. data-2026.10.04)'
        required: false
        default: ''
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Get release assets
        id: get_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # Look for the latest data release tag
            TAG=$(gh release list --limit 20 --json tagName -q '[.[] | select(.tagName | startswith("data-"))][0].tagName // ""')
          fi

          if [ -n "$TAG" ]; then
            echo "Downloading assets from tag: $TAG"
            gh release download "$TAG" --repo "${{ github.repository }}" --clobber \
              --pattern climafacts_kg.rdf --pattern climafacts_kg.ttl \
              --pattern cards.rdf --pattern cards.ttl
          else
            echo "No data-* tag found; downloading from latest release"
            gh release download --repo "${{ github.repository }}" --clobber \
              --pattern climafacts_kg.rdf --pattern climafacts_kg.ttl \
              --pattern cards.rdf --pattern cards.ttl
          fi

          for FILE_NAME in climafacts_kg.rdf climafacts_kg.ttl cards.rdf cards.ttl; do
            if [ ! -s "$FILE_NAME" ]; then
              echo "Error: File '${FILE_NAME}' not found in release assets."
              exit 1
            fi
          done
          touch .nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload TTL to GH-Pages
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
