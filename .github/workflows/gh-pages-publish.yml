name: Deploy Released ClimaFactsKG RDF to GH-Pages
'on':
  repository_dispatch:
    types: [release-event]
  workflow_dispatch: null
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Get latest release assets
        id: get_asset
        run: |
          # Published under climafacts-kg/ (not the Pages root) so this repo's
          # files can't collide with another repo's output on the same
          # org-level Pages site / custom domain.
          mkdir -p climafacts-kg
          ASSETS=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          for FILE_NAME in climafacts_kg.rdf climafacts_kg.ttl cards.rdf cards.ttl; do
            RELEASE_URL=$(echo "$ASSETS" | jq -r ".assets[] | select(.name == \"${FILE_NAME}\") | .browser_download_url")
            if [ -z "$RELEASE_URL" ]; then
              echo "Error: File '${FILE_NAME}' not found in the latest release assets."
              exit 1
            fi
            echo "Downloading '${FILE_NAME}' asset from: $RELEASE_URL"
            curl -L -o "climafacts-kg/${FILE_NAME}" "$RELEASE_URL"
          done
          touch .nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload TTL to GH-Pages
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
