name: Deploy Released ClimaFactsKG RDF to GH-Pages
'on':
  repository_dispatch:
    types: [release-event]
  workflow_dispatch: null
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Get latest release assets
        id: get_asset
        env:
          # Authenticated: the previous unauthenticated `curl` to the releases API
          # intermittently returned no `.assets` (rate limiting on shared runner IPs).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No custom domain (no CNAME) — this is a standard GitHub Project
          # Pages site, already served at
          # https://climatesense-project.github.io/climafacts-kg/ with the
          # repo-name path segment provided by GitHub's routing for free.
          # Publishing at the artifact root here is correct; adding another
          # climafacts-kg/ folder would double-nest the path and 404 the
          # actual site root (no index.html there).
          gh release download --repo "${{ github.repository }}" --clobber \
            --pattern climafacts_kg.rdf --pattern climafacts_kg.ttl \
            --pattern cards.rdf --pattern cards.ttl
          for FILE_NAME in climafacts_kg.rdf climafacts_kg.ttl cards.rdf cards.ttl; do
            if [ ! -s "$FILE_NAME" ]; then
              echo "Error: File '${FILE_NAME}' not found in the latest release assets."
              exit 1
            fi
          done
          touch .nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload TTL to GH-Pages
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
